name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting and lints are cheap, so they run first and fail fast.
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The C runtime is compiled by both supported compilers with warnings as
  # errors. It is linked into every instrumented target, so a warning here
  # would propagate into every build a user makes.
  runtime:
    name: Coverage runtime (clang and gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with gcc
        run: gcc -c -O2 -Wall -Wextra -Werror -o /tmp/rt-gcc.o runtime/aether_rt.c
      - name: Compile with clang
        run: clang -c -O2 -Wall -Wextra -Werror -o /tmp/rt-clang.o runtime/aether_rt.c
      - name: Build a fixture and check it runs standalone
        run: |
          ./runtime/aether-cc -o /tmp/ladder fixtures/coverage_ladder.c
          # An instrumented binary must behave normally with no AETHER_SHM_PATH
          # set, or fixtures stop being runnable by hand.
          printf 'AETHER' | /tmp/ladder; test $? -eq 6

  # Unit tests need no external tooling beyond a C compiler for the fixtures.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Report what this runner supports
        run: |
          clang --version
          gcc --version
          nproc
      - run: cargo test --all --locked
      - name: Doctor must find a usable backend
        run: cargo run --release --bin aether -- doctor

  # The integration suite compiles real fixtures and runs real campaigns, so it
  # is slower and runs in release mode.
  integration:
    name: Integration and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p aether-core --test exec_native
      - run: cargo test --release -p aether-core --test campaign_e2e
      - run: cargo test --release -p aether-core --test security
      - name: Demonstrate a full campaign through the CLI
        run: |
          cargo build --release
          ./runtime/aether-cc -o /tmp/crash_magic fixtures/crash_magic.c
          ./target/release/aether target inspect /tmp/crash_magic
          ./target/release/aether init --binary /tmp/crash_magic --output /tmp/ci.toml
          sed -i 's/duration_secs = 60/duration_secs = 20/' /tmp/ci.toml
          sed -i 's|dir = ".aether"|dir = "/tmp/.aether"|' /tmp/ci.toml
          # Exit 3 means findings were confirmed, which is the expected result
          # against a fixture with a planted defect.
          ./target/release/aether campaign run --config /tmp/ci.toml || test $? -eq 3
          ./target/release/aether findings list --dir /tmp/.aether
          ./target/release/aether report generate --dir /tmp/.aether --format sarif --output /tmp/findings.sarif
          python3 -c "import json; d=json.load(open('/tmp/findings.sarif')); assert d['version']=='2.1.0'; print('SARIF valid,', len(d['runs'][0]['results']), 'result(s)')"
      - name: A pooled campaign must share the load and report how it ran
        run: |
          ./runtime/aether-cc -o /tmp/toy_parser fixtures/toy_parser.c
          ./target/release/aether init --binary /tmp/toy_parser --output /tmp/pool.toml
          sed -i 's/duration_secs = 60/duration_secs = 20/' /tmp/pool.toml
          sed -i 's|dir = ".aether"|dir = "/tmp/.aether-pool"|' /tmp/pool.toml
          ./target/release/aether campaign run --config /tmp/pool.toml --workers 2 || test $? -eq 3
          # The pool must actually have run on both workers and said how. A
          # runner with one core still schedules both threads, so this checks
          # the reporting rather than the scaling.
          python3 - <<'PY'
          import glob, json, sys
          path = glob.glob('/tmp/.aether-pool/*/report.json')[0]
          d = json.load(open(path))
          p = d.get('parallel')
          assert p, 'a pooled campaign must report a parallel section'
          assert p['workers'] == 2, p
          assert len(p['per_worker_executions']) == 2, p
          assert all(e > 0 for e in p['per_worker_executions']), \
              f"every worker must run: {p['per_worker_executions']}"
          assert not p['worker_failures'], p['worker_failures']
          assert sum(s['executions'] for s in d['strategies']) > 0, \
              'pooled strategy statistics must not all be zero'
          assert any('Stagnation escalation is not applied' in l
                     for l in d['limitations']), d['limitations']
          print(f"pool ok: {p['executions']} execs, "
                f"{p['redundant_discoveries']} redundant, "
                f"{p['lock_wait_micros'] / 1e6:.2f}s lock wait")
          PY
      - name: The differential oracle must find a planted divergence
        run: |
          ./runtime/aether-cc -o /tmp/diff_a fixtures/diff_impl_a.c
          ./runtime/aether-cc -o /tmp/diff_b fixtures/diff_impl_b.c
          mkdir -p /tmp/diff-seeds && printf '+1' > /tmp/diff-seeds/plus
          cat > /tmp/diff.toml <<'EOF'
          schema_version = 1
          [target]
          name = "decimal_parser"
          kind = "differential"
          binary = "/tmp/diff_a"
          differential_binary = "/tmp/diff_b"
          timeout_ms = 1000
          [campaign]
          duration_secs = 0
          max_execs = 4000
          seed = 20260124
          max_input_bytes = 256
          [feedback]
          providers = ["edge-coverage", "exit-class", "differential"]
          [oracles]
          enabled = ["differential"]
          budget_fraction = 0.5
          check_retained_only = false
          [output]
          dir = "/tmp/.aether-diff"
          EOF
          ./target/release/aether campaign run --config /tmp/diff.toml --seeds /tmp/diff-seeds || test $? -eq 3
          python3 - <<'PY'
          import glob, json
          d = json.load(open(glob.glob('/tmp/.aether-diff/*/report.json')[0]))
          diffs = [f for f in d['findings']['items']
                   if f['evidence']['exit_class'] == 'oracle:differential']
          assert diffs, 'the differential oracle found no divergence'
          f = diffs[0]
          # A non-crashing disagreement must not be escalated, and must not be
          # reported as reproduction-validated.
          assert f['severity'] == 'behavioural-difference', f['severity']
          assert f['status'] == 'candidate', f['status']
          assert any('not a confirmed defect' in n for n in f['notes']), f['notes']
          print('differential oracle ok:', f['signature']['label'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-reports
          path: /tmp/.aether/**/report.*
          if-no-files-found: ignore

  # Marked separately: these depend on optional tooling and must not turn an
  # unrelated core failure into a mystery.
  optimizer:
    name: Optimisation lab (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Solver comparison against exhaustive ground truth
        run: cargo test --release -p aether-core --test optimizer_tuning -- --nocapture
      - name: Throughput probe
        run: cargo test --release -p aether-core --test perf_probe -- --nocapture

  plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/claude-code/mcp-server/package-lock.json
      - name: Build the MCP server
        working-directory: integrations/claude-code/mcp-server
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Health check reports its own status
        run: ./integrations/claude-code/scripts/health-check.sh
      - name: Validate the plugin manifest
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate ./integrations/claude-code
          else
            echo "claude CLI unavailable on this runner; validating manifest shape with python"
            python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("integrations/claude-code")
          manifest = json.loads((root / ".claude-plugin" / "plugin.json").read_text())
          assert manifest["name"] == "aether-fuzzing"
          # Component paths must start with ./ and must exist.
          for agent in manifest["agents"]:
              assert agent.startswith("./"), agent
              assert (root / agent[2:]).is_file(), agent
          mcp = json.loads((root / ".mcp.json").read_text())
          assert "aether" in mcp["mcpServers"]
          hooks = json.loads((root / "hooks" / "hooks.json").read_text())
          assert "hooks" in hooks, "a hooks file needs the top-level 'hooks' wrapper"
          for skill in (root / "skills").iterdir():
              assert (skill / "SKILL.md").is_file(), skill
          print("manifest shape ok")
          PY
          fi

  # One job that proves the whole thing works on a machine with no clang, since
  # that changes which capabilities are available and must degrade honestly
  # rather than fail.
  gcc-only:
    name: Degraded host (gcc only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build a target with gcc instrumentation
        run: |
          cargo build --release
          ./runtime/aether-cc --cc gcc -o /tmp/ladder-gcc fixtures/coverage_ladder.c
          # gcc gives no comparison log, so inspect must report that honestly
          # rather than recommending comparison-guided substitution.
          ./target/release/aether target inspect /tmp/ladder-gcc --json > /tmp/inspect.json
          python3 -c "
          import json
          d = json.load(open('/tmp/inspect.json'))
          assert d['instrumented'], 'gcc build should still report instrumentation'
          assert not d['comparison_log'], 'gcc has no trace-cmp; this must not claim otherwise'
          assert 'cmplog-guided' not in d['recommended_strategies'], 'must not recommend a strategy the target cannot feed'
          print('gcc-only capabilities reported honestly')
          "
